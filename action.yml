name: "LLM Drift Bench Gate"
description: "Run deterministic offline LLM drift detection, JSON schema checks, and CI exports."
branding:
  icon: "shield"
  color: "blue"

inputs:
  baseline:
    description: "Path to baseline captured outputs (.jsonl or .json)."
    required: true
  candidate:
    description: "Path to candidate captured outputs (.jsonl or .json)."
    required: true
  suite:
    description: "Optional path to prompt suite JSON/JSONL file."
    required: false
    default: ""
  config:
    description: "Optional path to drift.toml or drift.json policy file."
    required: false
    default: ""
  version:
    description: "Optional llm-drift-bench version specifier (e.g. '==0.4.0'). Empty installs latest."
    required: false
    default: ""
  python-version:
    description: "Python version to install (3.10+)."
    required: false
    default: "3.12"
  report-output:
    description: "Path to save the canonical JSON benchmark report."
    required: false
    default: "drift-report.json"
  junit-output:
    description: "Optional path to write JUnit XML output."
    required: false
    default: ""
  sarif-output:
    description: "Optional path to write SARIF 2.1.0 JSON output."
    required: false
    default: ""
  pr-comment-output:
    description: "Optional path to render a compact GitHub PR comment Markdown file."
    required: false
    default: ""
  audit-html-output:
    description: "Optional path to render a standalone offline unified audit HTML dashboard."
    required: false
    default: ""
  group-by:
    description: "Optional segmented distribution key ('category' or 'metadata:<key>') for audit."
    required: false
    default: ""
  fail-on-widespread:
    description: "Fail audit when segmented shift_scope is 'widespread' ('true' or 'false')."
    required: false
    default: "false"
  min-embedding-similarity:
    description: "Optional min mean embedding cosine similarity in [-1, 1] for offline audit."
    required: false
    default: ""
  baseline-conversations:
    description: "Optional baseline multi-turn conversations file (.json/.jsonl)."
    required: false
    default: ""
  candidate-conversations:
    description: "Optional candidate multi-turn conversations file (.json/.jsonl)."
    required: false
    default: ""
  conversations-html-output:
    description: "Optional path to render a standalone multi-turn conversation drift HTML report."
    required: false
    default: ""
  github-summary:
    description: "Append verdict and metrics to GITHUB_STEP_SUMMARY ('true' or 'false')."
    required: false
    default: "true"
  fail-on-drift:
    description: "Fail the workflow step when drift thresholds are breached ('true' or 'false')."
    required: false
    default: "true"

outputs:
  passed:
    description: "'true' if the drift gate passed, otherwise 'false'."
    value: ${{ steps.run-drift.outputs.passed }}
  mean-drift:
    description: "Mean composite drift score from the canonical report."
    value: ${{ steps.run-drift.outputs.mean_drift }}
  report-path:
    description: "Path to the saved JSON drift report."
    value: ${{ steps.run-drift.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install llm-drift-bench
      shell: bash
      env:
        PKG_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "llm-drift-bench${PKG_VERSION}"

    - name: Run llm-drift-bench evaluation
      id: run-drift
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_REPORT_OUTPUT: ${{ inputs.report-output }}
        INPUT_JUNIT_OUTPUT: ${{ inputs.junit-output }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        INPUT_PR_COMMENT_OUTPUT: ${{ inputs.pr-comment-output }}
        INPUT_AUDIT_HTML_OUTPUT: ${{ inputs.audit-html-output }}
        INPUT_GROUP_BY: ${{ inputs.group-by }}
        INPUT_FAIL_ON_WIDESPREAD: ${{ inputs.fail-on-widespread }}
        INPUT_MIN_EMBEDDING_SIMILARITY: ${{ inputs.min-embedding-similarity }}
        INPUT_BASELINE_CONVERSATIONS: ${{ inputs.baseline-conversations }}
        INPUT_CANDIDATE_CONVERSATIONS: ${{ inputs.candidate-conversations }}
        INPUT_CONVERSATIONS_HTML_OUTPUT: ${{ inputs.conversations-html-output }}
        INPUT_GITHUB_SUMMARY: ${{ inputs.github-summary }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
      run: |
        set +e
        args=(run -b "$INPUT_BASELINE" -c "$INPUT_CANDIDATE" -o "$INPUT_REPORT_OUTPUT")
        if [ -n "$INPUT_SUITE" ]; then
          args+=(-s "$INPUT_SUITE")
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_JUNIT_OUTPUT" ]; then
          args+=(--junit-output "$INPUT_JUNIT_OUTPUT")
        fi
        if [ -n "$INPUT_SARIF_OUTPUT" ]; then
          args+=(--sarif-output "$INPUT_SARIF_OUTPUT")
        fi
        if [ "$INPUT_GITHUB_SUMMARY" = "true" ]; then
          args+=(--github-summary)
        fi
        if [ "$INPUT_FAIL_ON_DRIFT" = "false" ]; then
          args+=(--no-fail-on-drift)
        fi
        llm-drift-bench "${args[@]}"
        rc=$?

        if [ -f "$INPUT_REPORT_OUTPUT" ]; then
          if [ -n "$INPUT_PR_COMMENT_OUTPUT" ]; then
            llm-drift-bench report -i "$INPUT_REPORT_OUTPUT" --format pr-comment -o "$INPUT_PR_COMMENT_OUTPUT"
          fi
          python - "$INPUT_REPORT_OUTPUT" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        print(f"passed={'true' if data.get('passed') else 'false'}")
        print(f"mean_drift={data.get('mean_composite_drift', '')}")
        print(f"report_path={sys.argv[1]}")
        PY
        fi

        if [ -n "$INPUT_AUDIT_HTML_OUTPUT" ]; then
          audit_args=(audit -b "$INPUT_BASELINE" -c "$INPUT_CANDIDATE" --format html -o "$INPUT_AUDIT_HTML_OUTPUT")
          if [ -n "$INPUT_SUITE" ]; then
            audit_args+=(-s "$INPUT_SUITE")
          fi
          if [ -n "$INPUT_CONFIG" ]; then
            audit_args+=(--config "$INPUT_CONFIG")
          fi
          if [ -n "$INPUT_GROUP_BY" ]; then
            audit_args+=(--group-by "$INPUT_GROUP_BY")
          fi
          if [ "$INPUT_FAIL_ON_WIDESPREAD" = "true" ]; then
            audit_args+=(--fail-on-widespread)
          fi
          if [ -n "$INPUT_MIN_EMBEDDING_SIMILARITY" ]; then
            audit_args+=(--min-embedding-similarity "$INPUT_MIN_EMBEDDING_SIMILARITY")
          fi
          if [ -n "$INPUT_BASELINE_CONVERSATIONS" ] && [ -n "$INPUT_CANDIDATE_CONVERSATIONS" ]; then
            audit_args+=(
              --baseline-conversations "$INPUT_BASELINE_CONVERSATIONS"
              --candidate-conversations "$INPUT_CANDIDATE_CONVERSATIONS"
            )
          fi
          llm-drift-bench "${audit_args[@]}"
          audit_rc=$?
          if [ "$rc" -eq 0 ] && [ "$audit_rc" -ne 0 ] && [ "$INPUT_FAIL_ON_DRIFT" != "false" ]; then
            rc=$audit_rc
          fi
        fi

        if [ -n "$INPUT_BASELINE_CONVERSATIONS" ] && [ -n "$INPUT_CANDIDATE_CONVERSATIONS" ]; then
          conv_args=(
            check-conversations
            -b "$INPUT_BASELINE_CONVERSATIONS"
            -c "$INPUT_CANDIDATE_CONVERSATIONS"
          )
          if [ -n "$INPUT_CONVERSATIONS_HTML_OUTPUT" ]; then
            conv_args+=(--format html -o "$INPUT_CONVERSATIONS_HTML_OUTPUT")
          fi
          llm-drift-bench "${conv_args[@]}"
          conv_rc=$?
          if [ "$rc" -eq 0 ] && [ "$conv_rc" -ne 0 ] && [ "$INPUT_FAIL_ON_DRIFT" != "false" ]; then
            rc=$conv_rc
          fi
        fi
        exit "$rc"
