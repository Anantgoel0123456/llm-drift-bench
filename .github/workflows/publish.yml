name: Publish distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this version? No runs checks only.'
        required: true
        type: choice
        default: 'No'
        options:
          - 'No'
          - 'Yes'
      registry:
        description: 'Target to publish to when Yes is selected'
        required: true
        type: choice
        default: 'TestPyPI'
        options:
          - 'TestPyPI'
          - 'PyPI'
          - 'GitHub Release only'

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build and verification tools
        run: python -m pip install -e ".[dev,opik]"

      - name: Verify source
        env:
          REQUIRE_OPIK: "1"
        run: |
          ruff check src tests
          mypy src
          pytest

      - name: Record the package version
        id: version
        run: |
          python - <<'PY'
          import os
          from llm_drift_bench import __version__
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('version=' + __version__ + '\n')
          PY

      - name: Verify production release version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && (inputs.registry == 'PyPI' || inputs.registry == 'GitHub Release only'))
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version
          from llm_drift_bench import __version__
          if os.environ['EVENT_NAME'] == 'release':
              assert os.environ['RELEASE_TAG'] == 'v' + __version__, 'Tag/version mismatch'
          assert not Version(__version__).is_devrelease, 'Development version cannot be released'
          PY

      - name: Build source distribution and binary wheel
        run: python -m build

      - name: Check distributions
        run: |
          twine check dist/*
          python scripts/check_installed.py dist/*.whl
          python scripts/check_installed.py dist/*.tar.gz

      - name: Store distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'TestPyPI'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/llm-drift-bench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'PyPI')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-drift-bench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-testpypi:
    name: Install the uploaded TestPyPI wheel
    needs: [build, testpypi]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'TestPyPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download the exact uploaded wheel and verify it
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/verify_registry.py testpypi "$PACKAGE_VERSION"

  verify-pypi:
    name: Install the uploaded PyPI wheel
    needs: [build, pypi]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'PyPI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download the exact uploaded wheel and verify it
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/verify_registry.py pypi "$PACKAGE_VERSION"

  github-release:
    name: Publish GitHub release and assets
    needs: [build, pypi, verify-pypi]
    if: >-
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (
        (
          (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'PyPI')) &&
          needs.pypi.result == 'success' &&
          needs.verify-pypi.result == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == 'Yes' && inputs.registry == 'GitHub Release only')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: distributions
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          notes = match.group(1).strip() if match else ""
          if notes:
              Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
