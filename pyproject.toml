[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-drift-bench"
dynamic = ["version"]
description = "Compare captured LLM outputs, validate JSON conformity, and catch regressions across model updates and quantizations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anant Goel" },
]
keywords = [
    "llm",
    "benchmark",
    "drift-detection",
    "json-validation",
    "quantization",
    "evaluation",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ai = ["openvino-genai"]
opik = ["opik>=1.10.24,<3"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=6.0.0",
]

[project.scripts]
llm-drift-bench = "llm_drift_bench.cli:main"

[project.urls]
Homepage = "https://github.com/Anantgoel0123456/llm-drift-bench"
Repository = "https://github.com/Anantgoel0123456/llm-drift-bench"
Issues = "https://github.com/Anantgoel0123456/llm-drift-bench/issues"
Changelog = "https://github.com/Anantgoel0123456/llm-drift-bench/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/llm_drift_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_drift_bench"]

[tool.hatch.build]
exclude = [
    "src/llm_drift_bench/_vendor/**",
    "/docs/commit-*.ps1",
    "/scripts/commit-*.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["llm_drift_bench"]

[tool.coverage.run]
source = ["llm_drift_bench"]
branch = true
omit = ["*/_vendor/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
